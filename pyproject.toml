[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heliofits-core"
version = "0.1.0"
description = "Find solar data, download it and keep it in one library."
requires-python = ">=3.10"
dependencies = ["astropy>=6", "numpy"]

[project.optional-dependencies]
archives = ["sunpy[net]>=6", "drms"]
test = ["pytest", "jsonschema"]

[project.scripts]
hfcore = "heliofits_core.cli:main"
heliad = "heliofits_core.cli:main"  # the old command name, kept

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heliofits_core = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
