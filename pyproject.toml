[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heliofits-core"
version = "0.1.0"
description = "Find solar data, download it and keep it in one library."
readme = "README.md"
license = {text = "MPL-2.0"}
classifiers = ["License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)"]
requires-python = ">=3.10"
dependencies = ["astropy>=6", "numpy", "jsonschema"]

[project.urls]
Repository = "https://github.com/GillySpace27/heliad"  # renamed with the repository

[project.optional-dependencies]
archives = ["sunpy[net]>=6", "drms"]
mcp = ["mcp>=2"]
parity = ["sunpy[map]>=6"]
test = ["pytest", "jsonschema"]

[project.scripts]
hfcore = "heliofits_core.cli:main"
heliad = "heliofits_core.cli:main"  # the old command name, kept
heliofits-mcp = "heliofits.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heliofits_core = ["schemas/*.json"]
heliofits = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
