# Keeps Heliad on HelioFITS Peek's current renderer. Weekly (and by hand) this moves
# app/Package.resolved to the newest commit of the Peek branch app/Package.swift follows,
# builds and tests the app against it, and opens a draft PR with the result. Gilly merges it;
# nothing merges itself. Builds stay reproducible: every other build uses the committed
# Package.resolved (make_app.sh passes --disable-automatic-resolution).
#
# A PR opened with GITHUB_TOKEN does not start other workflows, so the build and test
# results are in this run and linked from the PR body. Opening a PR needs the repository
# setting "Allow GitHub Actions to create and approve pull requests".
name: Follow Peek

on:
  schedule:
    - cron: "17 14 * * 1"  # Mondays, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: follow-peek
  cancel-in-progress: false

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Skip while a Follow Peek PR is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --state open --search "Follow HelioFITS Peek in:title" --json number --jq length)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = 0 ] || echo "SKIP: a Follow Peek PR is already open"
      - name: Update Peek in Package.resolved
        if: steps.open.outputs.count == '0'
        id: update
        working-directory: app
        run: |
          before=$(git hash-object Package.resolved 2>/dev/null || echo none)
          swift package update HelioFITS-Peek
          after=$(git hash-object Package.resolved)
          if [ "$before" = "$after" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "ok: Peek has not moved"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            git diff --stat -- Package.resolved || true
          fi
      - if: steps.update.outputs.changed == 'yes'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and test against the new Peek
        if: steps.update.outputs.changed == 'yes'
        working-directory: app
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/python" -m pip install "..[archives]"
          swift build --disable-automatic-resolution
          HELIAD_CORE="$RUNNER_TEMP/core/bin/python3" HELIAD_TEST_LIBRARY="$RUNNER_TEMP/library" \
            swift test --disable-automatic-resolution
      - name: Open a draft PR
        if: steps.update.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="follow-peek/$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add app/Package.resolved
          git commit -m "Follow HelioFITS Peek to its newest commit"
          git push -u origin "$branch"
          gh pr create --draft --title "Follow HelioFITS Peek to its newest commit" --body \
            "Moves app/Package.resolved to Peek's newest commit. The app built and its tests passed against it in $RUN_URL."
